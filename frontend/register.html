<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SmartCart - Register</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2,
                    #f093fb,
                    #4facfe
                );

            background-size: 400% 400%;

            animation:
                gradientBG 12s ease infinite;

            overflow: hidden;
        }

        @keyframes gradientBG {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }


        /* BACKGROUND DECORATIONS */

        .circle {

            position: absolute;

            border-radius: 50%;

            background:
                rgba(255,255,255,0.12);

            backdrop-filter:
                blur(5px);
        }

        .circle-one {

            width: 260px;

            height: 260px;

            top: -90px;

            left: -80px;
        }

        .circle-two {

            width: 360px;

            height: 360px;

            right: -130px;

            bottom: -120px;
        }

        .circle-three {

            width: 130px;

            height: 130px;

            right: 15%;

            top: 10%;
        }


        /* REGISTER CARD */

        .register-card {

            position: relative;

            z-index: 2;

            width: 440px;

            max-width: 92%;

            padding: 38px;

            background:
                rgba(255,255,255,0.96);

            border-radius: 28px;

            box-shadow:
                0 25px 60px
                rgba(0,0,0,0.25);

            text-align: center;

            animation:
                cardAppear 0.7s ease;
        }

        @keyframes cardAppear {

            from {

                opacity: 0;

                transform:
                    translateY(30px)
                    scale(0.96);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        /* LOGO */

        .logo {

            width: 78px;

            height: 78px;

            margin:
                0 auto 14px;

            border-radius: 23px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 40px;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            box-shadow:
                0 10px 25px
                rgba(102,126,234,0.35);
        }


        h1 {

            font-size: 30px;

            margin-bottom: 7px;

            background:
                linear-gradient(
                    90deg,
                    #667eea,
                    #764ba2,
                    #f093fb
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color:
                transparent;
        }


        .subtitle {

            color: #777;

            font-size: 15px;

            margin-bottom: 25px;
        }


        /* FORM */

        .input-group {

            text-align: left;

            margin-bottom: 17px;
        }


        .input-group label {

            display: block;

            font-weight: 600;

            color: #444;

            margin-bottom: 7px;

            font-size: 14px;
        }


        .input-wrapper {

            position: relative;
        }


        .input-icon {

            position: absolute;

            left: 14px;

            top: 50%;

            transform:
                translateY(-50%);

            font-size: 18px;
        }


        input,
        select {

            width: 100%;

            padding:
                13px
                14px
                13px
                45px;

            border:
                2px solid #e5e7eb;

            border-radius: 13px;

            font-size: 15px;

            outline: none;

            background: white;

            transition: 0.3s;
        }


        select {

            padding-left: 45px;

            cursor: pointer;
        }


        input:focus,
        select:focus {

            border-color: #667eea;

            box-shadow:
                0 0 0 4px
                rgba(102,126,234,0.12);
        }


        /* REGISTER BUTTON */

        .register-btn {

            width: 100%;

            border: none;

            padding: 14px;

            border-radius: 13px;

            margin-top: 7px;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 8px 20px
                rgba(102,126,234,0.3);

            transition: 0.3s;
        }


        .register-btn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 12px 25px
                rgba(102,126,234,0.4);
        }


        /* MESSAGE */

        #message {

            margin-top: 17px;

            padding: 11px;

            border-radius: 10px;

            font-size: 14px;

            display: none;
        }


        .success {

            display: block !important;

            background: #ecfdf5;

            color: #059669;
        }


        .error {

            display: block !important;

            background: #fff1f2;

            color: #e11d48;
        }


        /* LOGIN LINK */

        .login-text {

            margin-top: 22px;

            color: #777;

            font-size: 14px;
        }


        .login-link {

            color: #667eea;

            font-weight: bold;

            text-decoration: none;
        }


        .login-link:hover {

            text-decoration: underline;
        }


        .footer {

            margin-top: 20px;

            font-size: 12px;

            color: #999;
        }


        @media (max-width: 500px) {

            .register-card {

                padding: 30px 24px;
            }

            h1 {

                font-size: 27px;
            }

        }

    </style>

</head>


<body>


<div class="circle circle-one"></div>

<div class="circle circle-two"></div>

<div class="circle circle-three"></div>


<div class="register-card">


    <div class="logo">
        🛒
    </div>


    <h1>
        Create Your Account
    </h1>


    <p class="subtitle">
        Join SmartCart and enjoy smarter shopping
    </p>


    <form id="registerForm">


        <div class="input-group">

            <label>
                Username
            </label>

            <div class="input-wrapper">

                <span class="input-icon">
                    👤
                </span>

                <input
                    type="text"
                    id="username"
                    placeholder="Choose a username"
                    required
                >

            </div>

        </div>


        <div class="input-group">

            <label>
                Password
            </label>

            <div class="input-wrapper">

                <span class="input-icon">
                    🔒
                </span>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >

            </div>

        </div>


        <div class="input-group">

            <label>
                Account Type
            </label>

            <div class="input-wrapper">

                <span class="input-icon">
                    🎯
                </span>

                <select id="role">

                    <option value="customer">
                        Customer
                    </option>

                    <option value="admin">
                        Admin
                    </option>

                </select>

            </div>

        </div>


        <button
            type="submit"
            class="register-btn">

            ✨ Create SmartCart Account

        </button>


    </form>


    <div id="message"></div>


    <p class="login-text">

        Already have an account?

        <a
            href="index.html"
            class="login-link">

            Login Here

        </a>

    </p>


    <div class="footer">

        🛒 SmartCart
        • Intelligent E-Commerce Platform

    </div>


</div>


<script>


const API_URL =
    "http://127.0.0.1:8000";


document
    .getElementById("registerForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const username =
                document
                    .getElementById(
                        "username"
                    )
                    .value
                    .trim();


            const password =
                document
                    .getElementById(
                        "password"
                    )
                    .value;


            const role =
                document
                    .getElementById(
                        "role"
                    )
                    .value;


            const message =
                document
                    .getElementById(
                        "message"
                    );


            message.style.display =
                "none";


            try {

                const response =
                    await fetch(
                        API_URL +
                        "/auth/register",
                        {

                            method:
                                "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({

                                    username:
                                        username,

                                    password:
                                        password,

                                    role:
                                        role

                                })

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.detail ||
                        "Registration failed"
                    );

                }


                message.textContent =
                    "✅ Account created successfully! Redirecting to login...";

                message.className =
                    "success";


                document
                    .getElementById(
                        "registerForm"
                    )
                    .reset();


                setTimeout(
                    function() {

                        window.location.href =
                            "index.html";

                    },
                    1200
                );


            } catch (error) {

                message.textContent =
                    "❌ " +
                    error.message;

                message.className =
                    "error";

            }

        }
    );


</script>


</body>

</html>
