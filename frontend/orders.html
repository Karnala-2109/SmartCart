<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartCart - My Orders</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc
                );

            color: #1e293b;
        }


        /* ================================
           NAVBAR
        ================================= */

        .navbar {

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            color: white;

            padding: 18px 40px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.15);
        }


        .logo {

            font-size: 26px;

            font-weight: bold;
        }


        .nav-links {

            display: flex;

            gap: 12px;

            align-items: center;
        }


        .nav-links a {

            color: white;

            text-decoration: none;

            padding: 9px 15px;

            border-radius: 8px;

            transition: 0.3s;

            font-size: 14px;
        }


        .nav-links a:hover {

            background:
                rgba(255, 255, 255, 0.18);
        }


        /* ================================
           MAIN CONTAINER
        ================================= */

        .container {

            width: 92%;

            max-width: 1100px;

            margin: 40px auto;
        }


        .page-header {

            text-align: center;

            margin-bottom: 30px;
        }


        .page-header h1 {

            font-size: 34px;

            color: #312e81;

            margin-bottom: 8px;
        }


        .page-header p {

            color: #64748b;

            font-size: 15px;
        }


        /* ================================
           USER INFO
        ================================= */

        .user-box {

            background: white;

            padding: 18px 22px;

            border-radius: 16px;

            box-shadow:
                0 8px 25px
                rgba(15, 23, 42, 0.08);

            margin-bottom: 30px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;
        }


        .user-info {

            display: flex;

            align-items: center;

            gap: 12px;
        }


        .user-icon {

            width: 45px;

            height: 45px;

            border-radius: 50%;

            background:
                #eef2ff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 23px;
        }


        .user-text strong {

            display: block;

            color: #312e81;

            margin-bottom: 4px;
        }


        .user-text span {

            color: #64748b;

            font-size: 13px;
        }


        .refresh-btn {

            border: none;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            color: white;

            padding: 10px 18px;

            border-radius: 9px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        .refresh-btn:hover {

            transform: translateY(-1px);

            box-shadow:
                0 5px 15px
                rgba(79, 70, 229, 0.3);
        }


        .refresh-btn:disabled {

            opacity: 0.6;

            cursor: not-allowed;
        }


        /* ================================
           ORDERS GRID
        ================================= */

        .orders-container {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(320px, 1fr)
                );

            gap: 22px;
        }


        /* ================================
           ORDER CARD
        ================================= */

        .order-card {

            background: white;

            border-radius: 18px;

            padding: 24px;

            box-shadow:
                0 8px 25px
                rgba(15, 23, 42, 0.08);

            transition: 0.3s;

            border:
                1px solid #e2e8f0;
        }


        .order-card:hover {

            transform:
                translateY(-5px);

            box-shadow:
                0 14px 30px
                rgba(15, 23, 42, 0.13);
        }


        .order-top {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;
        }


        .order-id {

            font-size: 21px;

            font-weight: bold;

            color: #312e81;
        }


        /* ================================
           STATUS
        ================================= */

        .status {

            padding: 7px 13px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;
        }


        .status.pending {

            background: #fef3c7;

            color: #92400e;
        }


        .status.completed {

            background: #dcfce7;

            color: #166534;
        }


        .status.cancelled {

            background: #fee2e2;

            color: #991b1b;
        }


        .status.other {

            background: #e0e7ff;

            color: #3730a3;
        }


        /* ================================
           ORDER DETAILS
        ================================= */

        .order-info {

            border-top:
                1px solid #e2e8f0;

            border-bottom:
                1px solid #e2e8f0;

            padding: 15px 0;

            margin-bottom: 18px;
        }


        .info-row {

            display: flex;

            justify-content: space-between;

            margin-bottom: 11px;

            font-size: 14px;
        }


        .info-row:last-child {

            margin-bottom: 0;
        }


        .info-label {

            color: #64748b;
        }


        .info-value {

            font-weight: bold;

            color: #334155;
        }


        .total-row .info-value {

            color: #4f46e5;

            font-size: 18px;
        }


        /* ================================
           DETAILS BUTTON
        ================================= */

        .details-btn {

            width: 100%;

            border: none;

            background: #eef2ff;

            color: #4338ca;

            padding: 11px;

            border-radius: 9px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        .details-btn:hover {

            background: #e0e7ff;
        }


        /* ================================
           MESSAGE
        ================================= */

        .message {

            background: white;

            border-radius: 16px;

            padding: 35px;

            text-align: center;

            color: #64748b;

            box-shadow:
                0 8px 25px
                rgba(15, 23, 42, 0.07);

            grid-column: 1 / -1;
        }


        .message-icon {

            font-size: 42px;

            margin-bottom: 12px;
        }


        .error {

            color: #b91c1c;
        }


        /* ================================
           MODAL
        ================================= */

        .modal {

            display: none;

            position: fixed;

            z-index: 1000;

            left: 0;

            top: 0;

            width: 100%;

            height: 100%;

            background:
                rgba(15, 23, 42, 0.55);

            align-items: center;

            justify-content: center;

            padding: 20px;
        }


        .modal.show {

            display: flex;
        }


        .modal-content {

            background: white;

            width: 100%;

            max-width: 650px;

            max-height: 85vh;

            overflow-y: auto;

            border-radius: 20px;

            padding: 28px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.25);

            position: relative;
        }


        .modal-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 22px;
        }


        .modal-header h2 {

            color: #312e81;
        }


        .close-btn {

            border: none;

            background: #f1f5f9;

            width: 36px;

            height: 36px;

            border-radius: 50%;

            font-size: 20px;

            cursor: pointer;

            color: #334155;
        }


        .close-btn:hover {

            background: #e2e8f0;
        }


        .modal-summary {

            background: #eef2ff;

            padding: 18px;

            border-radius: 12px;

            margin-bottom: 20px;
        }


        .modal-summary-row {

            display: flex;

            justify-content: space-between;

            margin-bottom: 8px;
        }


        .modal-summary-row:last-child {

            margin-bottom: 0;
        }


        .items-title {

            font-size: 18px;

            font-weight: bold;

            color: #334155;

            margin-bottom: 12px;
        }


        .item-card {

            border:
                1px solid #e2e8f0;

            border-radius: 12px;

            padding: 15px;

            margin-bottom: 10px;
        }


        .item-row {

            display: flex;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 7px;

            font-size: 14px;
        }


        .item-row:last-child {

            margin-bottom: 0;
        }


        .item-label {

            color: #64748b;
        }


        .item-value {

            font-weight: bold;
        }


        /* ================================
           RESPONSIVE
        ================================= */

        @media (max-width: 700px) {

            .navbar {

                padding: 15px 20px;

                flex-direction: column;

                gap: 12px;
            }


            .nav-links {

                flex-wrap: wrap;

                justify-content: center;
            }


            .container {

                width: 94%;

                margin-top: 25px;
            }


            .page-header h1 {

                font-size: 28px;
            }


            .user-box {

                flex-direction: column;

                align-items: stretch;
            }


            .refresh-btn {

                width: 100%;
            }
        }

    </style>
</head>


<body>


<!-- =========================================
     NAVBAR
========================================= -->

<nav class="navbar">

    <div class="logo">
        🛒 SmartCart
    </div>


    <div class="nav-links">

        <a href="dashboard.html">
            🏠 Dashboard
        </a>


        <a href="products.html">
            🛍️ Products
        </a>


        <a href="cart.html">
            🛒 Cart
        </a>


        <a href="wishlist.html">
            ❤️ Wishlist
        </a>


        <a href="orders.html">
            📦 My Orders
        </a>

    </div>

</nav>



<!-- =========================================
     MAIN
========================================= -->

<div class="container">


    <div class="page-header">

        <h1>
            📦 My Orders
        </h1>

        <p>
            View your previous orders and order details
        </p>

    </div>



    <!-- =========================================
         LOGGED-IN USER
    ========================================= -->

    <div class="user-box">

        <div class="user-info">

            <div class="user-icon">
                👤
            </div>


            <div class="user-text">

                <strong id="usernameText">
                    Loading user...
                </strong>

                <span id="customerText">
                    Verifying your account...
                </span>

            </div>

        </div>


        <button
            class="refresh-btn"
            id="refreshButton"
            onclick="loadOrders()"
        >
            🔄 Refresh Orders
        </button>

    </div>



    <!-- =========================================
         ORDERS
    ========================================= -->

    <div
        class="orders-container"
        id="ordersContainer"
    >

        <div class="message">

            <div class="message-icon">
                ⏳
            </div>

            <h3>
                Loading your orders...
            </h3>

        </div>

    </div>

</div>



<!-- =========================================
     ORDER DETAILS MODAL
========================================= -->

<div
    class="modal"
    id="orderModal"
    onclick="closeModalOutside(event)"
>

    <div
        class="modal-content"
        onclick="event.stopPropagation()"
    >

        <div class="modal-header">

            <h2>
                📦 Order Details
            </h2>


            <button
                class="close-btn"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>


        <div id="modalBody">

        </div>

    </div>

</div>



<script>


    // =========================================
    // API
    // =========================================

    const API_URL =
        "http://127.0.0.1:8000";


    // =========================================
    // GLOBAL CUSTOMER
    // =========================================

    let customerId = null;

    let loggedInUser = null;


    // =========================================
    // AUTHENTICATION
    // =========================================

    async function getLoggedInUser() {

        const token =
            localStorage.getItem(
                "access_token"
            );


        // -----------------------------------------
        // No token
        // -----------------------------------------

        if (!token) {

            window.location.href =
                "index.html";

            return null;
        }


        try {

            const response =
                await fetch(
                    API_URL + "/auth/me",
                    {
                        method: "GET",

                        headers: {

                            "Authorization":
                                "Bearer " + token

                        }
                    }
                );


            const data =
                await response.json();


            console.log(
                "Logged-in user:",
                data
            );


            if (!response.ok) {

                localStorage.removeItem(
                    "access_token"
                );

                localStorage.removeItem(
                    "customer_id"
                );

                window.location.href =
                    "index.html";

                return null;
            }


            // -----------------------------------------
            // Validate customer mapping
            // -----------------------------------------

            if (
                data.customer_id === null ||
                data.customer_id === undefined
            ) {

                throw new Error(
                    "Your account is not mapped to a customer."
                );
            }


            loggedInUser =
                data;


            customerId =
                Number(
                    data.customer_id
                );


            console.log(
                "Using customer ID:",
                customerId
            );


            // -----------------------------------------
            // Update user information
            // -----------------------------------------

            document.getElementById(
                "usernameText"
            ).textContent =
                "Welcome, " +
                data.username;


            document.getElementById(
                "customerText"
            ).textContent =
                "Customer ID: " +
                customerId;


            return data;

        } catch (error) {

            console.error(
                "Authentication error:",
                error
            );


            document.getElementById(
                "ordersContainer"
            ).innerHTML = `

                <div class="message error">

                    <div class="message-icon">
                        ❌
                    </div>

                    <h3>
                        Authentication failed
                    </h3>

                    <p style="margin-top:8px;">
                        ${escapeHtml(
                            error.message
                        )}
                    </p>

                </div>

            `;


            return null;
        }

    }



    // =========================================
    // LOAD ORDERS
    // =========================================

    async function loadOrders() {

        const container =
            document.getElementById(
                "ordersContainer"
            );


        const refreshButton =
            document.getElementById(
                "refreshButton"
            );


        // -----------------------------------------
        // Check customer
        // -----------------------------------------

        if (!customerId) {

            const user =
                await getLoggedInUser();


            if (!user) {

                return;
            }

        }


        // -----------------------------------------
        // Loading
        // -----------------------------------------

        refreshButton.disabled =
            true;


        refreshButton.innerText =
            "⏳ Loading...";


        container.innerHTML = `

            <div class="message">

                <div class="message-icon">
                    ⏳
                </div>

                <h3>
                    Loading your orders...
                </h3>

            </div>

        `;


        try {

            const token =
                localStorage.getItem(
                    "access_token"
                );


            if (!token) {

                throw new Error(
                    "Authentication token not found."
                );
            }


            // -----------------------------------------
            // Get orders for logged-in customer
            // -----------------------------------------

            const response =
                await fetch(
                    API_URL +
                    "/orders/?customer_id=" +
                    encodeURIComponent(
                        customerId
                    ),
                    {
                        method: "GET",

                        headers: {

                            "Authorization":
                                "Bearer " + token

                        }
                    }
                );


            const data =
                await response.json();


            console.log(
                "Orders response:",
                data
            );


            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    "Unable to load orders"
                );

            }


            // -----------------------------------------
            // No orders
            // -----------------------------------------

            if (
                !Array.isArray(data) ||
                data.length === 0
            ) {

                container.innerHTML = `

                    <div class="message">

                        <div class="message-icon">
                            📭
                        </div>

                        <h3>
                            No orders yet
                        </h3>

                        <p style="margin-top:8px;">
                            You haven't placed any orders yet.
                        </p>

                    </div>

                `;

                return;
            }


            // -----------------------------------------
            // Display orders
            // -----------------------------------------

            container.innerHTML =
                data.map(
                    order =>
                        createOrderCard(
                            order
                        )
                ).join("");


        } catch (error) {

            console.error(
                "Load orders error:",
                error
            );


            container.innerHTML = `

                <div class="message error">

                    <div class="message-icon">
                        ❌
                    </div>

                    <h3>
                        Unable to load orders
                    </h3>

                    <p style="margin-top:8px;">
                        ${escapeHtml(
                            error.message
                        )}
                    </p>

                </div>

            `;

        } finally {

            refreshButton.disabled =
                false;

            refreshButton.innerText =
                "🔄 Refresh Orders";

        }

    }



    // =========================================
    // CREATE ORDER CARD
    // =========================================

    function createOrderCard(order) {

        const status =
            order.status ||
            "Unknown";


        const statusClass =
            getStatusClass(
                status
            );


        const amount =
            Number(
                order.total_amount || 0
            ).toLocaleString(
                "en-IN",
                {
                    minimumFractionDigits: 2,

                    maximumFractionDigits: 2
                }
            );


        const formattedDate =
            formatDate(
                order.order_date
            );


        return `

            <div class="order-card">


                <div class="order-top">


                    <div class="order-id">

                        #${order.order_id}

                    </div>


                    <div class="
                        status
                        ${statusClass}
                    ">

                        ${escapeHtml(
                            status
                        )}

                    </div>

                </div>



                <div class="order-info">


                    <div class="info-row">

                        <span class="info-label">
                            Customer ID
                        </span>


                        <span class="info-value">

                            ${order.customer_id}

                        </span>

                    </div>



                    <div class="info-row">

                        <span class="info-label">
                            Order Date
                        </span>


                        <span class="info-value">

                            ${formattedDate}

                        </span>

                    </div>



                    <div class="
                        info-row
                        total-row
                    ">

                        <span class="info-label">
                            Total Amount
                        </span>


                        <span class="info-value">

                            ₹${amount}

                        </span>

                    </div>

                </div>



                <button
                    class="details-btn"
                    onclick="viewOrderDetails(
                        ${order.order_id}
                    )"
                >

                    👁️ View Details

                </button>

            </div>

        `;

    }



    // =========================================
    // VIEW ORDER DETAILS
    // =========================================

    async function viewOrderDetails(
        orderId
    ) {

        const modal =
            document.getElementById(
                "orderModal"
            );


        const modalBody =
            document.getElementById(
                "modalBody"
            );


        modalBody.innerHTML = `

            <div class="message">

                <div class="message-icon">
                    ⏳
                </div>

                <p>
                    Loading order details...
                </p>

            </div>

        `;


        modal.classList.add(
            "show"
        );


        try {

            const token =
                localStorage.getItem(
                    "access_token"
                );


            if (!token) {

                throw new Error(
                    "Authentication token not found."
                );
            }


            // -----------------------------------------
            // Get order
            // -----------------------------------------

            const orderResponse =
                await fetch(
                    API_URL +
                    "/orders/" +
                    orderId,
                    {
                        method: "GET",

                        headers: {

                            "Authorization":
                                "Bearer " + token

                        }
                    }
                );


            const order =
                await orderResponse.json();


            if (!orderResponse.ok) {

                throw new Error(
                    order.detail ||
                    "Unable to load order"
                );

            }


            // -----------------------------------------
            // Get order items
            // -----------------------------------------

            const itemsResponse =
                await fetch(
                    API_URL +
                    "/order-items/?order_id=" +
                    orderId,
                    {
                        method: "GET",

                        headers: {

                            "Authorization":
                                "Bearer " + token

                        }
                    }
                );


            const items =
                await itemsResponse.json();


            if (!itemsResponse.ok) {

                throw new Error(
                    items.detail ||
                    "Unable to load order items"
                );

            }


            // -----------------------------------------
            // Display
            // -----------------------------------------

            displayOrderDetails(
                order,
                items
            );


        } catch (error) {

            console.error(
                "Order details error:",
                error
            );


            modalBody.innerHTML = `

                <div class="message error">

                    <div class="message-icon">
                        ❌
                    </div>

                    <h3>
                        Unable to load order details
                    </h3>

                    <p style="margin-top:8px;">
                        ${escapeHtml(
                            error.message
                        )}
                    </p>

                </div>

            `;

        }

    }



    // =========================================
    // DISPLAY ORDER DETAILS
    // =========================================

    function displayOrderDetails(
        order,
        items
    ) {

        const amount =
            Number(
                order.total_amount || 0
            ).toLocaleString(
                "en-IN",
                {
                    minimumFractionDigits: 2,

                    maximumFractionDigits: 2
                }
            );


        const status =
            order.status ||
            "Unknown";


        let itemsHtml = "";


        if (
            !Array.isArray(items) ||
            items.length === 0
        ) {

            itemsHtml = `

                <div class="item-card">

                    <p>
                        No order items found.
                    </p>

                </div>

            `;

        } else {

            itemsHtml =
                items.map(
                    item => {

                        const price =
                            Number(
                                item.price || 0
                            ).toLocaleString(
                                "en-IN",
                                {
                                    minimumFractionDigits: 2,

                                    maximumFractionDigits: 2
                                }
                            );


                        const quantity =
                            Number(
                                item.quantity || 0
                            );


                        const itemTotal =
                            (
                                Number(
                                    item.price || 0
                                ) *
                                quantity
                            ).toLocaleString(
                                "en-IN",
                                {
                                    minimumFractionDigits: 2,

                                    maximumFractionDigits: 2
                                }
                            );


                        return `

                            <div class="item-card">


                                <div class="item-row">

                                    <span class="item-label">
                                        Product ID
                                    </span>


                                    <span class="item-value">

                                        ${item.product_id}

                                    </span>

                                </div>



                                <div class="item-row">

                                    <span class="item-label">
                                        Quantity
                                    </span>


                                    <span class="item-value">

                                        ${quantity}

                                    </span>

                                </div>



                                <div class="item-row">

                                    <span class="item-label">
                                        Price
                                    </span>


                                    <span class="item-value">

                                        ₹${price}

                                    </span>

                                </div>



                                <div class="item-row">

                                    <span class="item-label">
                                        Item Total
                                    </span>


                                    <span class="item-value">

                                        ₹${itemTotal}

                                    </span>

                                </div>


                            </div>

                        `;

                    }
                ).join("");

        }


        document.getElementById(
            "modalBody"
        ).innerHTML = `

            <div class="modal-summary">


                <div class="modal-summary-row">

                    <span>
                        Order ID
                    </span>


                    <strong>
                        #${order.order_id}
                    </strong>

                </div>



                <div class="modal-summary-row">

                    <span>
                        Customer ID
                    </span>


                    <strong>
                        ${order.customer_id}
                    </strong>

                </div>



                <div class="modal-summary-row">

                    <span>
                        Date
                    </span>


                    <strong>
                        ${formatDate(
                            order.order_date
                        )}
                    </strong>

                </div>



                <div class="modal-summary-row">

                    <span>
                        Status
                    </span>


                    <strong>
                        ${escapeHtml(
                            status
                        )}
                    </strong>

                </div>



                <div class="modal-summary-row">

                    <span>
                        Total
                    </span>


                    <strong>
                        ₹${amount}
                    </strong>

                </div>

            </div>



            <div class="items-title">

                🛍️ Order Items

            </div>


            ${itemsHtml}

        `;

    }



    // =========================================
    // STATUS CLASS
    // =========================================

    function getStatusClass(
        status
    ) {

        const value =
            String(status)
                .toLowerCase();


        if (
            value === "pending"
        ) {

            return "pending";

        }


        if (
            value === "completed"
        ) {

            return "completed";

        }


        if (
            value === "cancelled" ||
            value === "canceled"
        ) {

            return "cancelled";

        }


        return "other";

    }



    // =========================================
    // DATE FORMAT
    // =========================================

    function formatDate(
        dateString
    ) {

        if (!dateString) {

            return "N/A";

        }


        const date =
            new Date(
                dateString
            );


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return dateString;

        }


        return date.toLocaleDateString(
            "en-IN",
            {
                day: "2-digit",

                month: "short",

                year: "numeric"
            }
        );

    }



    // =========================================
    // CLOSE MODAL
    // =========================================

    function closeModal() {

        document
            .getElementById(
                "orderModal"
            )
            .classList.remove(
                "show"
            );

    }



    function closeModalOutside(
        event
    ) {

        if (
            event.target.id ===
            "orderModal"
        ) {

            closeModal();

        }

    }



    // =========================================
    // ESCAPE HTML
    // =========================================

    function escapeHtml(
        value
    ) {

        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            value;


        return div.innerHTML;

    }



    // =========================================
    // ESC KEY
    // =========================================

    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Escape"
            ) {

                closeModal();

            }

        }
    );



    // =========================================
    // INITIALIZE PAGE
    // =========================================

    async function initializeOrders() {

        console.log(
            "Initializing My Orders..."
        );


        const user =
            await getLoggedInUser();


        if (!user) {

            return;

        }


        await loadOrders();

    }



    // =========================================
    // START
    // =========================================

    initializeOrders();

</script>
