<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SmartCart - Recommendations</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2,
                    #f093fb
                );

            color: #333;
        }


        /* ================= NAVBAR ================= */

        .navbar {

            background:
                rgba(255,255,255,0.97);

            padding: 16px 30px;

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.15);

            position: sticky;

            top: 0;

            z-index: 100;
        }


        .logo {

            font-size: 25px;

            font-weight: bold;

            color: #5a55ca;
        }


        .nav-buttons {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }


        .nav-buttons button {

            border: none;

            padding: 10px 15px;

            border-radius: 10px;

            background: #eef2ff;

            color: #4c51bf;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        .nav-buttons button:hover {

            background: #667eea;

            color: white;

            transform:
                translateY(-2px);
        }


        .logout-btn {

            background:
                #fee2e2 !important;

            color:
                #b91c1c !important;
        }


        .logout-btn:hover {

            background:
                #ef4444 !important;

            color: white !important;
        }


        /* ================= CONTAINER ================= */

        .container {

            width: 95%;

            max-width: 1400px;

            margin: 30px auto;
        }


        .header {

            background: white;

            border-radius: 20px;

            padding: 30px;

            margin-bottom: 25px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.15);

            text-align: center;
        }


        .header h1 {

            color: #4c51bf;

            margin-bottom: 10px;
        }


        .header p {

            color: #666;

            font-size: 16px;
        }


        /* ================= CUSTOMER ================= */

        .customer-box {

            background: white;

            padding: 20px;

            border-radius: 18px;

            margin-bottom: 25px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.12);

            display: flex;

            align-items: center;

            gap: 15px;

            flex-wrap: wrap;
        }


        .customer-box label {

            font-weight: bold;

            color: #444;
        }


        .customer-box input {

            padding: 12px;

            border:
                2px solid #ddd;

            border-radius: 10px;

            font-size: 16px;

            background: #f8fafc;

            width: 180px;

            color: #4c51bf;

            font-weight: bold;
        }


        .customer-box input:focus {

            outline: none;

            border-color: #667eea;

            box-shadow:
                0 0 0 3px
                rgba(102,126,234,0.15);
        }


        .customer-box button {

            padding: 12px 20px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            color: white;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        .customer-box button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 5px 15px
                rgba(102,126,234,0.35);
        }


        /* ================= MESSAGE ================= */

        #message {

            display: none;

            padding: 15px;

            border-radius: 12px;

            margin-bottom: 20px;

            font-weight: bold;

            text-align: center;
        }


        .success {

            display: block !important;

            background: #dcfce7;

            color: #166534;
        }


        .error {

            display: block !important;

            background: #fee2e2;

            color: #991b1b;
        }


        /* ================= CATEGORY ================= */

        .section-title {

            color: white;

            margin: 25px 0 15px;

            font-size: 23px;
        }


        .category-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(160px, 1fr)
                );

            gap: 15px;

            margin-bottom: 30px;
        }


        .category-btn {

            border: none;

            border-radius: 16px;

            padding: 20px 15px;

            background: white;

            color: #4c51bf;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 7px 20px
                rgba(0,0,0,0.14);

            transition: 0.3s;
        }


        .category-btn:hover {

            transform:
                translateY(-5px)
                scale(1.02);

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            color: white;
        }


        /* ================= PRODUCT GRID ================= */

        .product-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(220px, 1fr)
                );

            gap: 20px;
        }


        .product-card {

            background: white;

            border-radius: 18px;

            padding: 22px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.15);

            transition: 0.3s;

            position: relative;
        }


        .product-card:hover {

            transform:
                translateY(-7px);

            box-shadow:
                0 15px 35px
                rgba(0,0,0,0.20);
        }


        .product-icon {

            font-size: 42px;

            margin-bottom: 12px;
        }


        .product-card h3 {

            color: #4c51bf;

            margin-bottom: 10px;

            font-size: 19px;
        }


        .product-card p {

            color: #666;

            margin: 7px 0;
        }


        .price {

            color: #059669 !important;

            font-size: 19px;

            font-weight: bold;
        }


        .rating {

            color: #d97706 !important;

            font-weight: bold;
        }


        .category-link {

            display: inline-block;

            margin-top: 5px;

            padding: 6px 10px;

            border-radius: 8px;

            background: #eef2ff;

            color: #4c51bf;

            font-size: 13px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .category-link:hover {

            background: #667eea;

            color: white;
        }


        .view-btn {

            width: 100%;

            margin-top: 14px;

            padding: 11px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            color: white;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        .view-btn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 5px 15px
                rgba(102,126,234,0.35);
        }


        .loading {

            background: white;

            padding: 30px;

            border-radius: 15px;

            text-align: center;

            color: #666;

            grid-column: 1 / -1;
        }


        /* ================= RESPONSIVE ================= */

        @media(max-width: 600px) {

            .navbar {

                flex-direction: column;

                gap: 15px;
            }

            .customer-box {

                flex-direction: column;

                align-items: flex-start;
            }

            .customer-box input {

                width: 100%;
            }

            .customer-box button {

                width: 100%;
            }

        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="logo">
        🛒 SmartCart
    </div>


    <div class="nav-buttons">

        <button
            onclick="goToProducts()"
        >
            🛍️ Products
        </button>


        <button
            onclick="goToDashboard()"
        >
            📊 Dashboard
        </button>


        <button
            onclick="goToPrediction()"
        >
            🔮 Prediction
        </button>


        <button
            onclick="goToSegment()"
        >
            👥 Segment
        </button>


        <button
            class="logout-btn"
            onclick="logout()"
        >
            🚪 Logout
        </button>

    </div>

</nav>


<!-- ================= MAIN ================= -->

<div class="container">


    <div class="header">

        <h1>
            🤖 AI Product Recommendations
        </h1>

        <p id="headerText">
            Enter a Customer ID to view personalized
            SmartCart recommendations.
        </p>

    </div>


    <div id="message"></div>


    <!-- CUSTOMER -->

    <div class="customer-box">

        <label for="customerId">
            👤 Enter Customer ID:
        </label>

        <input
            type="number"
            id="customerId"
            min="1"
            placeholder="Enter Customer ID"
        >

        <button
            type="button"
            onclick="loadRecommendations()"
        >
            🔍 View Recommendations
        </button>

    </div>


    <!-- CATEGORY -->

    <h2 class="section-title">
        🛍️ Browse Products By Category
    </h2>


    <div class="category-grid">

        <button
            class="category-btn"
            onclick="openCategory('Electronics')"
        >
            💻 Electronics
        </button>


        <button
            class="category-btn"
            onclick="openCategory('Beauty')"
        >
            💄 Beauty
        </button>


        <button
            class="category-btn"
            onclick="openCategory('Home')"
        >
            🏠 Home
        </button>


        <button
            class="category-btn"
            onclick="openCategory('Books')"
        >
            📚 Books
        </button>


        <button
            class="category-btn"
            onclick="openCategory('Clothing')"
        >
            👕 Clothing
        </button>


        <button
            class="category-btn"
            onclick="openCategory('Sports')"
        >
            ⚽ Sports
        </button>


        <button
            class="category-btn"
            onclick="openCategory('Toys')"
        >
            🧸 Toys
        </button>


        <button
            class="category-btn"
            onclick="openCategory('Grocery')"
        >
            🛒 Grocery
        </button>

    </div>


    <!-- RECOMMENDATIONS -->

    <h2 class="section-title">
        ⭐ Recommended For You
    </h2>


    <div
        id="recommendations"
        class="product-grid"
    >

        <div class="loading">

            👤 Enter Customer ID above and click
            <strong>View Recommendations</strong>.

        </div>

    </div>


</div>


<script>


const API_URL =
    "http://127.0.0.1:8000";


/* =====================================================
   AUTHENTICATION
===================================================== */


function checkAuthentication() {

    const token =
        localStorage.getItem(
            "access_token"
        );

    if (!token) {

        window.location.href =
            "index.html";

        return false;
    }

    return true;
}


/* =====================================================
   NAVIGATION
===================================================== */


function goToProducts() {

    window.location.href =
        "products.html";
}


function goToDashboard() {

    window.location.href =
        "dashboard.html";
}


function goToPrediction() {

    window.location.href =
        "prediction.html";
}


function goToSegment() {

    window.location.href =
        "segment.html";
}


/* =====================================================
   LOGOUT
===================================================== */


function logout() {

    localStorage.removeItem(
        "access_token"
    );

    localStorage.removeItem(
        "customer_id"
    );

    localStorage.removeItem(
        "username"
    );

    localStorage.removeItem(
        "role"
    );


    window.location.href =
        "index.html";
}


/* =====================================================
   CUSTOMER ID
===================================================== */


function getCustomerId() {

    const input =
        document.getElementById(
            "customerId"
        );


    const customerId =
        input.value.trim();


    if (!customerId) {

        showMessage(
            "⚠️ Please enter Customer ID.",
            "error"
        );

        input.focus();

        return null;
    }


    if (
        Number(customerId) < 1
    ) {

        showMessage(
            "⚠️ Customer ID must be greater than 0.",
            "error"
        );

        input.focus();

        return null;
    }


    return customerId;
}


/* =====================================================
   CATEGORY
===================================================== */


function openCategory(
    category
) {

    window.location.href =
        "products.html?category=" +
        encodeURIComponent(
            category
        );
}


/* =====================================================
   MESSAGE
===================================================== */


function showMessage(
    message,
    type
) {

    const element =
        document.getElementById(
            "message"
        );


    element.textContent =
        message;


    element.className =
        type;


    element.style.display =
        "block";
}


/* =====================================================
   LOAD RECOMMENDATIONS
===================================================== */


async function loadRecommendations() {

    const customerId =
        getCustomerId();


    if (!customerId) {

        return;
    }


    document.getElementById(
        "headerText"
    ).textContent =
        "Loading personalized recommendations for Customer "
        + customerId
        + "...";


    document.getElementById(
        "recommendations"
    ).innerHTML = `

        <div class="loading">

            🤖 Loading personalized recommendations...

        </div>

    `;


    try {

        const response =
            await fetch(
                API_URL +
                "/ml/recommendations/" +
                customerId
            );


        if (!response.ok) {

            let errorMessage =
                "Recommendations could not be loaded.";

            try {

                const errorData =
                    await response.json();

                errorMessage =
                    errorData.detail ||
                    errorMessage;

            } catch (e) {
                // Ignore JSON parsing error
            }


            throw new Error(
                errorMessage
            );
        }


        const data =
            await response.json();


        const products =
            Array.isArray(data)
                ? data
                : (
                    data.recommendations ||
                    data.products ||
                    []
                );


        displayRecommendations(
            products
        );


        document.getElementById(
            "headerText"
        ).textContent =
            "Personalized recommendations for Customer "
            + customerId
            + " based on SmartCart activity.";


        showMessage(
            "✅ Recommendations loaded successfully for Customer "
            + customerId
            + ".",
            "success"
        );


    } catch (error) {

        console.error(error);


        showMessage(
            "❌ " + error.message,
            "error"
        );


        document.getElementById(
            "headerText"
        ).textContent =
            "Unable to load recommendations for Customer "
            + customerId
            + ".";


        document.getElementById(
            "recommendations"
        ).innerHTML = `

            <div class="loading">

                ❌ Unable to load recommendations.

            </div>

        `;
    }
}


/* =====================================================
   DISPLAY RECOMMENDATIONS
===================================================== */


function displayRecommendations(
    products
) {

    const container =
        document.getElementById(
            "recommendations"
        );


    if (
        !products ||
        products.length === 0
    ) {

        container.innerHTML = `

            <div class="loading">

                😔 No recommendations available
                for this customer.

            </div>

        `;

        return;
    }


    container.innerHTML =
        products.map(
            product => `

                <div class="product-card">

                    <div class="product-icon">

                        ${getCategoryIcon(
                            product.category
                        )}

                    </div>


                    <h3>

                        ${
                            product.product_name ||
                            product.name ||
                            "Product"
                        }

                    </h3>


                    <p>

                        Category:

                        <span
                            class="category-link"
                            onclick="openCategory(
                                '${escapeCategory(
                                    product.category
                                )}'
                            )"
                        >

                            ${
                                product.category ||
                                "Unknown"
                            }

                        </span>

                    </p>


                    <p class="price">

                        ${
                            formatCurrency(
                                product.price
                            )
                        }

                    </p>


                    <p class="rating">

                        ⭐
                        ${
                            product.rating ??
                            "-"
                        }

                    </p>


                    <p>

                        Stock:
                        ${
                            product.stock ??
                            "Available"
                        }

                    </p>


                    <button
                        class="view-btn"
                        onclick="openProduct(
                            ${product.product_id}
                        )"
                    >
                        👁️ View Product
                    </button>

                </div>

            `
        ).join("");
}


/* =====================================================
   CATEGORY ICON
===================================================== */


function getCategoryIcon(
    category
) {

    const icons = {

        Electronics: "💻",

        Beauty: "💄",

        Home: "🏠",

        Books: "📚",

        Clothing: "👕",

        Sports: "⚽",

        Toys: "🧸",

        Grocery: "🛒"

    };


    return icons[category] ||
        "🛍️";
}


/* =====================================================
   OPEN PRODUCT
===================================================== */


function openProduct(
    productId
) {

    window.location.href =
        "products.html?product_id=" +
        encodeURIComponent(
            productId
        );
}


/* =====================================================
   FORMAT CURRENCY
===================================================== */


function formatCurrency(
    value
) {

    if (
        value === undefined ||
        value === null ||
        value === ""
    ) {

        return "₹-";
    }


    const number =
        Number(value);


    if (isNaN(number)) {

        return "₹" + value;
    }


    return "₹" +
        number.toLocaleString(
            "en-IN",
            {
                maximumFractionDigits: 2
            }
        );
}


/* =====================================================
   ESCAPE CATEGORY
===================================================== */


function escapeCategory(
    category
) {

    if (!category) {

        return "";
    }


    return String(category)
        .replace(
            /'/g,
            "\\'"
        );
}


/* =====================================================
   ENTER KEY
===================================================== */


document
    .getElementById("customerId")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                loadRecommendations();

            }

        }
    );


/* =====================================================
   START
===================================================== */


checkAuthentication();

/*
 * Recommendations intentionally do NOT
 * load automatically.
 *
 * User must enter Customer ID and click
 * "View Recommendations".
 */

</script>


</body>

</html>
